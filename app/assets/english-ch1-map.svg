<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" width="640" height="430" role="img" font-family="sans-serif" font-size="20" text-anchor="middle" fill="currentColor" stroke="currentColor" stroke-width="2">
  <title>Street map with six places and a road</title>

  <!-- Back row: Bookstore, Hospital, Park -->
  <rect x="20" y="30" width="180" height="100" rx="6" fill-opacity="0.08"/>
  <text x="110" y="88" stroke="none">Bookstore</text>
  <rect x="96" y="122" width="28" height="16" fill-opacity="1"/>

  <rect x="230" y="30" width="180" height="100" rx="6" fill-opacity="0.08"/>
  <text x="320" y="88" stroke="none">Hospital</text>
  <rect x="306" y="122" width="28" height="16" fill-opacity="1"/>

  <rect x="440" y="30" width="180" height="100" rx="6" fill-opacity="0.16"/>
  <circle cx="470" cy="55" r="9" fill-opacity="0.35"/>
  <circle cx="590" cy="55" r="9" fill-opacity="0.35"/>
  <text x="530" y="88" stroke="none">Park</text>
  <rect x="516" y="122" width="28" height="16" fill-opacity="1"/>

  <!-- Front row: Post Office, Bank, School -->
  <rect x="20" y="190" width="180" height="100" rx="6" fill-opacity="0.08"/>
  <text x="110" y="248" stroke="none">Post Office</text>
  <rect x="96" y="282" width="28" height="16" fill-opacity="1"/>

  <rect x="230" y="190" width="180" height="100" rx="6" fill-opacity="0.08"/>
  <text x="320" y="248" stroke="none">Bank</text>
  <rect x="306" y="282" width="28" height="16" fill-opacity="1"/>

  <rect x="440" y="190" width="180" height="100" rx="6" fill-opacity="0.08"/>
  <text x="530" y="248" stroke="none">School</text>
  <rect x="516" y="282" width="28" height="16" fill-opacity="1"/>

  <!-- Road -->
  <rect x="0" y="330" width="640" height="80" fill-opacity="0.14" stroke="none"/>
  <line x1="0" y1="330" x2="640" y2="330"/>
  <line x1="0" y1="410" x2="640" y2="410"/>
  <line x1="20" y1="370" x2="230" y2="370" stroke-dasharray="18 12"/>
  <line x1="410" y1="370" x2="620" y2="370" stroke-dasharray="18 12"/>
  <text x="320" y="377" stroke="none">Main Road</text>
</svg>
