  <!-- ground -->
  <rect x="0" y="350" width="600" height="50" fill="currentColor" fill-opacity="0.08" stroke="none"/>
  <line x1="8" y1="350" x2="592" y2="350"/>

  <!-- sun with rays, top right -->
  <circle cx="548" cy="52" r="20" fill="currentColor" fill-opacity="0.15"/>
