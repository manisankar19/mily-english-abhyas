  <line x1="582" y1="52" x2="592" y2="52"/>
  <line x1="524" y1="28" x2="517" y2="21"/>
  <line x1="572" y1="28" x2="579" y2="21"/>
  <line x1="524" y1="76" x2="517" y2="83"/>
  <line x1="572" y1="76" x2="579" y2="83"/>

